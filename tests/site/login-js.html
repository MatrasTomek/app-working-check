<!doctype html><html><head><meta charset="utf-8"><title>Logowanie JS</title></head>
<body><h1>Zaloguj się (JS)</h1>
<input id="e" type="text">
<input id="p" type="password">
<a id="go" href="#">Zaloguj</a>
<script>
document.getElementById('go').addEventListener('click', async function (ev) {
  ev.preventDefault();
  const body = new URLSearchParams({user: document.getElementById('e').value,
                                    pass: document.getElementById('p').value});
  const r = await fetch('/login', {method: 'POST', body, redirect: 'manual',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'}});
  if (r.type === 'opaqueredirect' || r.ok && r.redirected) location.href = '/dashboard.html';
});
</script></body></html>
